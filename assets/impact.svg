<svg xmlns="http://www.w3.org/2000/svg" width="980" height="226" viewBox="0 0 980 226" role="img" aria-labelledby="title"><title id="title">4 production AI agents; error investigation reduced to 10–20 seconds from 10–15 minutes; deployed across 3 environments.</title><rect x="1" y="1" width="978" height="224" rx="16" fill="#101318" stroke="#303744"/><g font-family="Arial, Helvetica, sans-serif"><rect x="24" y="22" width="300" height="181" rx="12" fill="#181d25"/><text x="44" y="83" font-size="44" fill="#ff5264" font-weight="800" >4</text><text x="44" y="127" font-size="15" fill="#f5f7fb" font-weight="700" letter-spacing=".5">PRODUCTION AI AGENTS</text><text x="44" y="164" font-size="19" fill="#c1cad8" font-weight="400" >Slack · Teams · Phone</text><rect x="340" y="22" width="300" height="181" rx="12" fill="#181d25"/><text x="360" y="83" font-size="44" fill="#ff5264" font-weight="800" >10–20 sec</text><text x="360" y="127" font-size="15" fill="#f5f7fb" font-weight="700" letter-spacing=".5">ERROR INVESTIGATION</text><text x="360" y="164" font-size="19" fill="#c1cad8" font-weight="400" >Down from 10–15 minutes</text><rect x="656" y="22" width="300" height="181" rx="12" fill="#181d25"/><text x="676" y="83" font-size="44" fill="#ff5264" font-weight="800" >3</text><text x="676" y="127" font-size="15" fill="#f5f7fb" font-weight="700" letter-spacing=".5">DEPLOYMENT ENVIRONMENTS</text><text x="676" y="164" font-size="19" fill="#c1cad8" font-weight="400" >Dev · Staging · Production</text></g></svg>